<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Skill Bill</title>
  <desc id="desc">Spec in. Merge-ready PR out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.42" stop-color="#101015"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="22%" r="55%">
      <stop offset="0" stop-color="#f4c430" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f4c430" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c430"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c430"/>
      <stop offset="1" stop-color="#8f6d05"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(980 315) skewX(-18)">
    <rect x="-240" y="-480" width="520" height="960" fill="url(#gold)"/>
    <rect x="-40" y="-480" width="200" height="960" fill="#050506" opacity="0.88"/>
  </g>

  <g transform="translate(72 86)">
    <g>
      <rect width="56" height="56" rx="14" fill="url(#iconGold)"/>
      <text x="50" y="46" fill="#070709" font-family="'DejaVu Sans Mono', 'Fira Code', monospace" font-size="22" font-weight="700" text-anchor="end">SB</text>
      <circle cx="44" cy="14" r="5" fill="#60d394"/>
    </g>

    <text x="0" y="168" fill="#f4c430" font-family="'Fira Sans Condensed', 'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="118" font-weight="800" letter-spacing="1">SKILL BILL</text>
    <text x="2" y="268" fill="#f4f0e4" font-family="'Fira Sans Condensed', 'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="52" font-weight="700">SPEC IN.</text>
    <text x="2" y="332" fill="#f4f0e4" font-family="'Fira Sans Condensed', 'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="52" font-weight="700">MERGE-READY PR OUT.</text>
    <text x="2" y="430" fill="#f7efd3" font-family="'Fira Sans Condensed', 'DejaVu Sans', sans-serif" font-size="24" font-weight="500">Governed process for AI coding agents.</text>
  </g>
</svg>
